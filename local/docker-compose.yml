# $0 / OSS / local-only dev substrate for reporium-audit.
#
# Cloud dependency  ->  OSS substitute
#   reporium-api (Cloud Run)            -> nginx serving baked JSON fixtures
#   api.github.com (GitHub Actions API) -> same nginx (DNS-aliased + self-signed TLS)
#   raw.githubusercontent.com           -> same nginx (DNS-aliased + self-signed TLS)
#
# The audit (dev branch) hardcodes the GitHub hosts (api.github.com,
# raw.githubusercontent.com). We redirect them to the local nginx via Docker
# network ALIASES on the substrate service, and the runner trusts the nginx
# self-signed cert through SSL_CERT_FILE. No audit source is modified -- the
# real HTTPS code path runs unchanged.

name: reporium-audit-local

services:
  substrate:
    image: nginx:1.27-alpine
    # Install openssl (alpine nginx lacks it), then run the cert/stamp entrypoint.
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null 2>&1; exec /bin/sh /scripts/substrate-entrypoint.sh"]
    networks:
      default:
        aliases:
          - reporium-api.local
          - api.github.com
          - raw.githubusercontent.com
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/srv/api:ro
      - ./mock-api:/srv/api-github:ro
      - ./mock-raw:/srv/raw                       # writable: entrypoint stamps index.json
      - ./scripts:/scripts:ro
      - certs:/etc/nginx/certs                    # shared with runner for SSL_CERT_FILE
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "--no-check-certificate", "https://127.0.0.1/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  audit:
    build:
      context: .
      dockerfile: audit.Dockerfile
    depends_on:
      substrate:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Trust the substrate's self-signed cert for ALL https calls (httpx/ssl).
      SSL_CERT_FILE: /certs/substrate.crt
    volumes:
      - ../reporium_audit:/app/reporium_audit:ro   # REAL source, read-only
      - ./scripts:/scripts:ro
      - certs:/certs:ro
    # Default to a no-op; `make smoke` overrides with the smoke script.
    command: "echo 'audit runner ready; use: make smoke'"

networks:
  default:

volumes:
  certs:
