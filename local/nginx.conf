worker_processes 1;
events { worker_connections 64; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr warn;

    # Self-signed cert covering all three substituted hosts (SANs):
    #   reporium-api.local, api.github.com, raw.githubusercontent.com
    # Trusted by the audit container via SSL_CERT_FILE (zero source edits).
    ssl_certificate     /etc/nginx/certs/substrate.crt;
    ssl_certificate_key /etc/nginx/certs/substrate.key;

    # ------------------------------------------------------------------
    # reporium-api OSS substitute. REPORIUM_API_URL points here.
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen 80;
        server_name reporium-api.local localhost;
        root /srv/api;

        # GET /health
        location = /health { try_files /health.json =404; }
        # GET /repos?limit=1  (query string ignored)
        location = /repos { try_files /repos_list.json =404; }
        # GET /search?q=python
        location = /search { try_files /search.json =404; }
        # GET /library/full
        location = /library/full { try_files /library_full.json =404; }
    }

    # ------------------------------------------------------------------
    # api.github.com substitute (audit hardcodes this host).
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name api.github.com;
        root /srv/api-github;

        # /repos/<owner>/<repo>/actions/runs?per_page=N  -> static file at that path
        location ~ ^/repos/(?<rest>.+)/actions/runs$ {
            try_files /repos/$rest/actions/runs =404;
        }
        location / { return 404; }
    }

    # ------------------------------------------------------------------
    # raw.githubusercontent.com substitute (audit hardcodes this host).
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name raw.githubusercontent.com;
        root /srv/raw;
        default_type text/plain;
        location / { try_files $uri =404; }
    }
}
